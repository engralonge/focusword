name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npx expo install --check
      - run: npm run export:web
      - name: Type-check Edge Functions
        run: |
          deno check --config supabase/functions/summarize-passage/deno.json supabase/functions/summarize-passage/index.ts
          deno check --config supabase/functions/bible-content/deno.json supabase/functions/bible-content/index.ts
          deno check --config supabase/functions/livekit-token/deno.json supabase/functions/livekit-token/index.ts
          deno check --config supabase/functions/livekit-webhook/deno.json supabase/functions/livekit-webhook/index.ts
          deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
      - name: Test Edge Function helpers
        run: deno test --config supabase/functions/summarize-passage/deno.json supabase/functions/_shared/rateLimit.test.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Apply migrations to a fresh database
        run: supabase db start
      - name: Lint database functions and schema
        run: supabase db lint --local --schema public --level warning --fail-on error
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
