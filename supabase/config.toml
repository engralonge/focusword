project_id = "focusword"

[auth]
site_url = "focusword://auth/callback"
additional_redirect_urls = [
  "focusword://auth/callback",
  "focusword://auth/reset-password",
]
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.summarize-passage]
verify_jwt = true

[functions.bible-content]
verify_jwt = true

[functions.livekit-token]
verify_jwt = false

[functions.livekit-stage]
verify_jwt = false

[functions.livekit-webhook]
verify_jwt = false

[functions.livekit-recording]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.push-notifications]
verify_jwt = false
